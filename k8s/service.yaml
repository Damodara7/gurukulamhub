apiVersion: v1
kind: Service
metadata:
  name: gurukulamhub-app
  namespace: gurukulamhub
  labels:
    app: gurukulamhub-app
spec:
  type: ClusterIP  # Use LoadBalancer if you need external IP, or NodePort for local
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: gurukulamhub-app
  # Session affinity is CRITICAL for WebSocket connections
  # Ensures all requests from the same client go to the same pod
  # This is required because WebSocket state (globalThis.__chatClientsByGroupId) is per-pod
  sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800  # 3 hours - keep WebSocket connections on same pod

