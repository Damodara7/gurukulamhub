<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - GurukulamHub</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Light theme (default) */
        --bg-color: #f4f5fa;
        --text-color: #2e2e3a;
        --text-secondary: rgba(46, 46, 58, 0.7);
        --icon-bg: rgba(140, 87, 255, 0.1);
        --icon-shadow: rgba(140, 87, 255, 0.2);
        --icon-shadow-hover: rgba(140, 87, 255, 0.3);
        --button-bg: #8c57ff;
        --button-bg-hover: #7e4ee6;
        --button-shadow: rgba(140, 87, 255, 0.3);
        --button-shadow-hover: rgba(140, 87, 255, 0.4);
      }

      [data-theme='dark'],
      @media (prefers-color-scheme: dark) {
        :root {
          /* Dark theme */
          --bg-color: #28243d;
          --text-color: #fff;
          --text-secondary: rgba(255, 255, 255, 0.8);
          --icon-bg: rgba(140, 87, 255, 0.1);
          --icon-shadow: rgba(140, 87, 255, 0.2);
          --icon-shadow-hover: rgba(140, 87, 255, 0.3);
          --button-bg: #8c57ff;
          --button-bg-hover: #7e4ee6;
          --button-shadow: rgba(140, 87, 255, 0.3);
          --button-shadow-hover: rgba(140, 87, 255, 0.4);
        }
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: var(--bg-color);
        color: var(--text-color);
        text-align: center;
        padding: 20px;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .container {
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }

      .icon-container {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        background: var(--icon-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-shadow: 0 8px 32px var(--icon-shadow);
        animation: pulse 2s ease-in-out infinite;
        transition: all 0.3s ease;
      }

      .icon-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 12px;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 8px 32px var(--icon-shadow);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 12px 40px var(--icon-shadow-hover);
        }
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        color: var(--text-color);
        font-weight: 700;
        line-height: 1.2;
        transition: color 0.3s ease;
      }

      p {
        font-size: 1rem;
        margin-bottom: 0;
        color: var(--text-secondary);
        line-height: 1.6;
        transition: color 0.3s ease;
      }

      button {
        background: var(--button-bg);
        color: #fff;
        padding: 14px 32px;
        font-size: 1rem;
        border-radius: 8px;
        font-weight: 600;
        text-transform: none;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px var(--button-shadow);
        margin-top: 1rem;
      }

      button:hover {
        background: var(--button-bg-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px var(--button-shadow-hover);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px var(--button-shadow);
      }

      @media (max-width: 480px) {
        .icon-container {
          width: 100px;
          height: 100px;
        }

        h1 {
          font-size: 1.75rem;
        }

        p {
          font-size: 0.95rem;
        }

        button {
          padding: 12px 24px;
          font-size: 0.95rem;
        }
      }
    </style>
    <script>
      // Check for app's theme preference in localStorage
      ;(function () {
        try {
          // Check for MUI theme mode (common storage key pattern)
          const themeKeys = ['mui-template-mode', 'theme-mode', 'color-mode', 'gurukulamhub-mui-template-mode']

          let themeMode = null

          // Try to find theme preference in localStorage
          for (let key of themeKeys) {
            const stored = localStorage.getItem(key)
            if (stored && (stored === 'dark' || stored === 'light')) {
              themeMode = stored
              break
            }
          }

          // Also check for system preference
          if (!themeMode) {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            themeMode = prefersDark ? 'dark' : 'light'
          }

          // Apply theme
          if (themeMode === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
          } else {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (e) {
          // Fallback to system preference if localStorage access fails
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (prefersDark) {
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        }
      })()
    </script>
  </head>
  <body>
    <div class="container">
      <!-- <div class="icon-container">
        <img src="/icons/icon-192x192.png" alt="GurukulamHub Icon" />
      </div> -->
      <div class="content">
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
      </div>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
