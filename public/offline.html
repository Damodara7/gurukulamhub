<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - GurukulamHub</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 500px;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: white;
        font-weight: bold;
      }

      p {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        opacity: 0.9;
        color: white;
      }

      button {
        background: white;
        color: #667eea;
        padding: 12px 24px;
        font-size: 1rem;
        border-radius: 6px;
        font-weight: 600;
        text-transform: none;
        border: none;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.9);
        transform: scale(1.05);
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're Offline</h1>
      <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
