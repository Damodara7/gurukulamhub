name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch: # Allow manual trigger

env:
  DROPLET_IP: 139.59.6.209
  DROPLET_USER: root
  APP_DIR: /var/www/gurukulamhub
  DOMAIN: gurukulamhub.org

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Digital Ocean
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Add this line

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH key with proper formatting (handles line endings correctly)
          # Use printf to preserve the key format and ensure Unix line endings
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa

          # Remove any Windows line endings (CRLF -> LF) and ensure proper format
          sed -i 's/\r$//' ~/.ssh/id_rsa

          # Ensure the key file ends with a newline
          if [ -n "$(tail -c 1 ~/.ssh/id_rsa)" ]; then
            echo "" >> ~/.ssh/id_rsa
          fi

          chmod 600 ~/.ssh/id_rsa

          # Verify the key format
          if ! ssh-keygen -l -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "❌ Error: SSH key format is invalid"
            echo "First 100 chars of key:"
            head -c 100 ~/.ssh/id_rsa
            exit 1
          fi

          # Add server to known_hosts
          ssh-keyscan -H ${{ env.DROPLET_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          # Configure SSH keepalive to prevent connection timeout during long builds
          cat > ~/.ssh/config << 'SSHCONFIG'
          Host *
            ServerAliveInterval 60
            ServerAliveCountMax 3
            StrictHostKeyChecking no
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCONFIG
          chmod 600 ~/.ssh/config

          # Test SSH connection
          echo "Testing SSH connection..."
          ssh -i ~/.ssh/id_rsa -o ConnectTimeout=10 -o BatchMode=yes ${{ env.DROPLET_USER }}@${{ env.DROPLET_IP }} "echo 'SSH connection successful'" || {
            echo "⚠️  SSH connection test failed, but continuing..."
          }

      - name: Copy files to server
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.git' \
            --exclude '.env*' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=60 -o ServerAliveCountMax=3" \
            ./ ${{ env.DROPLET_USER }}@${{ env.DROPLET_IP }}:${{ env.APP_DIR }}/

      - name: Create .env.production on server
        run: |
          ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ env.DROPLET_USER }}@${{ env.DROPLET_IP }} << 'EOF'
            cd ${{ env.APP_DIR }}
            
            # Always create/update .env.production with latest values
            cat > .env.production << 'ENVFILE'
          # -----------------------------------------------------------------------------
          # App Configuration
          # -----------------------------------------------------------------------------
          BASEPATH=
          DOMAIN=${{ env.DOMAIN }}
          NEXT_PUBLIC_APP_URL=https://${{ env.DOMAIN }}
          NEXT_PUBLIC_DOCS_URL=https://demos.themeselection.com/materio-mui-react-nextjs-admin-template/documentation
          NODE_ENV=production
          PORT=3000

          # -----------------------------------------------------------------------------
          # Authentication (NextAuth.js)
          # -----------------------------------------------------------------------------
          NEXTAUTH_BASEPATH=/api/auth
          NEXTAUTH_URL=https://${{ env.DOMAIN }}
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          # AUTH_TRUST_HOST=https://${{ env.DOMAIN }}
          AUTH_TRUST_HOST=true

          # -----------------------------------------------------------------------------
          # Google OAuth 2.0
          # -----------------------------------------------------------------------------
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}

          # -----------------------------------------------------------------------------
          # API
          # -----------------------------------------------------------------------------
          API_URL=https://${{ env.DOMAIN }}/api
          NEXT_PUBLIC_API_URL=https://${{ env.DOMAIN }}/api

          # -----------------------------------------------------------------------------
          # App Features
          # -----------------------------------------------------------------------------
          USE_FALLBACK_MUTATION=true

          # -----------------------------------------------------------------------------
          # Database
          # -----------------------------------------------------------------------------
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          MONGODB_URI=${{ secrets.DATABASE_URL }}
          MONGODB_DB=gurkulhub

          # -----------------------------------------------------------------------------
          # Redis
          # -----------------------------------------------------------------------------
          REDIS_URL=redis://redis:6379
          REDIS_HOST=redis
          REDIS_PORT=6379

          # -----------------------------------------------------------------------------
          # AWS S3
          # -----------------------------------------------------------------------------
          NEXT_PUBLIC_AWS_S3_ACCESS_KEY_ID=${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          NEXT_PUBLIC_AWS_S3_ACCESS_KEY_SECRET=${{ secrets.AWS_S3_ACCESS_KEY_SECRET }}
          NEXT_PUBLIC_AWS_S3_GAMES_UPLOAD_BUCKET=${{ secrets.AWS_S3_GAMES_UPLOAD_BUCKET }}
          NEXT_PUBLIC_AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}
          NEXT_PUBLIC_AWS_S3_USERPROFILE_UPLOAD_BUCKET=${{ secrets.AWS_S3_USERPROFILE_UPLOAD_BUCKET }}
          NEXT_PUBLIC_AWS_S3_QUIZ_UPLOAD_BUCKET=${{ secrets.AWS_S3_QUIZ_UPLOAD_BUCKET }}

          # -----------------------------------------------------------------------------
          # DigitalOcean Spaces
          # -----------------------------------------------------------------------------
          S3_REGION=${{ secrets.S3_REGION }}
          S3_SPACE_NAME=${{ secrets.S3_SPACE_NAME }}
          S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
          S3_ACCESS_KEY_SECRET=${{ secrets.S3_ACCESS_KEY_SECRET }}

          # -----------------------------------------------------------------------------

          # -----------------------------------------------------------------------------
          # Google ReCAPTCHA
          # -----------------------------------------------------------------------------
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}
          RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}

          # -----------------------------------------------------------------------------
          # Socket Server
          # -----------------------------------------------------------------------------
          NEXT_PUBLIC_SOCKET_IO_SERVER=${{ secrets.SOCKET_IO_SERVER }}

          # -----------------------------------------------------------------------------
          # Stripe
          # -----------------------------------------------------------------------------
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          NEXT_PUBLIC_STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}

          # -----------------------------------------------------------------------------
          # Admin
          # -----------------------------------------------------------------------------
          SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
          NEXT_PUBLIC_SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}

          # -----------------------------------------------------------------------------
          # TEST_MODE
          # -----------------------------------------------------------------------------
          NEXT_PUBLIC_TEST_MODE=${{ secrets.TEST_MODE || 'true' }}
          TEST_MODE=${{ secrets.TEST_MODE || 'true' }}

          # -----------------------------------------------------------------------------
          # VAPID Keys (Web Push Notifications)
          # -----------------------------------------------------------------------------
          NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL=${{ secrets.VAPID_EMAIL }}

          # -----------------------------------------------------------------------------
          # AI / LLM
          # -----------------------------------------------------------------------------
          # If not explicitly set, app defaults to OPENAI and needs OPENAI_API_KEY.
          LLM_PROVIDER=${{ secrets.LLM_PROVIDER || 'gemini' }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          ENVFILE
          EOF

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_rsa -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ env.DROPLET_USER }}@${{ env.DROPLET_IP }} << 'EOF'
            set -e
            cd ${{ env.APP_DIR }}
            
            echo "🚀 Starting deployment..."
            
            # Pull latest code (if using git)
            if [ -d .git ]; then
              git pull origin main || true
            fi
            
            # Export environment variables from .env.production for build args
            echo "📦 Loading environment variables for build..."
            set -a
            source .env.production 2>/dev/null || true
            set +a
            
            # Zero-downtime friendly update: do NOT bring the stack down first.
            # Recreate only changed containers in-place.
            echo "🔨 Building and updating containers without full shutdown..."
            docker compose pull || true
            docker compose build --progress=plain
            docker compose up -d --remove-orphans
            
            # Wait for app to be ready
            echo "⏳ Waiting for app to be ready..."
            sleep 15
            
            # Check if containers are running
            echo "✅ Checking container status..."
            docker compose ps
            
            # Check app health
            echo "🏥 Checking app health..."
            APP_HEALTHY=false
            for i in {1..45}; do
              if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ App is healthy!"
                APP_HEALTHY=true
                break
              fi
              echo "Waiting for app to be ready... ($i/45)"
              sleep 2
            done

            if [ "$APP_HEALTHY" != "true" ]; then
              echo "❌ App failed health check after deployment"
              docker compose ps || true
              docker compose logs --tail=200 app || true
              exit 1
            fi
            
            # Clean up old images
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f
            
            echo "🎉 Deployment completed!"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://${{ env.DOMAIN }}/api/health || echo "⚠️  Health check failed, but deployment may still be in progress"
